<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO MINI BOT - Live Signal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #07090e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 8px;
    }

    .bot-title {
      font-size: 13px;
      font-weight: 800;
      color: #ffb703;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 10px;
      color: #8b949e;
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      background-color: #1a2332;
      color: #00ffcc;
      border: 1px solid #2a384c;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* Stop/Start Button */
    .toggle-btn {
      width: 100%;
      background: #ff3b5c;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 10px;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .toggle-btn.running {
      background: #ff3b5c;
    }

    .toggle-btn.stopped {
      background: #00c853;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: #1a2332;
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.5s linear;
    }

    /* Status Box */
    .status-panel {
      background-color: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }

    .timer-display {
      font-size: 18px;
      font-weight: 900;
      color: #ffb703;
      margin-bottom: 4px;
    }

    .status-text {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Signal Output Box */
    .signal-output {
      background-color: #0b0f19;
      border: 1px solid #2a384c;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .signal-output.call {
      color: #00c853;
      border-color: #00c853;
      background: rgba(0, 200, 83, 0.1);
    }

    .signal-output.put {
      color: #ff3b5c;
      border-color: #ff3b5c;
      background: rgba(255, 59, 92, 0.1);
    }

    .footer-note {
      font-size: 10px;
      color: #8b949e;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <div class="bot-title">⚡ PO MINI BOT</div>
    <div style="font-size: 11px; color: #00c853; font-weight: bold;" id="modeStatus">REAL</div>
  </div>

  <div class="control-group">
    <label class="control-label">Dooro Lamaanaha Lacagta</label>
    <select id="assetSelect">
      <option value="CAD/JPY OTC">CAD/JPY OTC</option>
      <option value="EUR/USD OTC">EUR/USD OTC</option>
      <option value="GBP/USD OTC">GBP/USD OTC</option>
      <option value="AUD/USD OTC">AUD/USD OTC</option>
      <option value="USD/JPY OTC">USD/JPY OTC</option>
      <option value="USD/CHF OTC">USD/CHF OTC</option>
    </select>
  </div>

  <!-- Stop / Start Button -->
  <button class="toggle-btn running" id="toggleBtn" onclick="toggleBot()">■ STOP</button>

  <!-- Progress Bar -->
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Status Panel -->
  <div class="status-panel">
    <div class="timer-display" id="timerDisplay">5s</div>
    <div class="status-text" id="statusText">WAITING...</div>
  </div>

  <!-- Signal Box -->
  <div class="signal-output" id="signalOutput">
    Signal: —
  </div>

  <div class="footer-note">• REAL SIGNAL ONLY •</div>
</div>

<script>
  let isRunning = true;
  let botInterval = null;
  let countdownTimer = null;

  function toggleBot() {
    isRunning = !isRunning;
    const btn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    
    if (isRunning) {
      btn.innerText = "■ STOP";
      btn.className = "toggle-btn running";
      statusText.innerText = "WAITING...";
      startBotLoop();
    } else {
      btn.innerText = "► START";
      btn.className = "toggle-btn stopped";
      statusText.innerText = "STOPPED";
      clearInterval(botInterval);
      clearInterval(countdownTimer);
      document.getElementById('timerDisplay').innerText = "--";
      document.getElementById('signalOutput').className = "signal-output";
      document.getElementById('signalOutput').innerText = "Signal: —";
      document.getElementById('progressFill').style.width = "0%";
    }
  }

  function startBotLoop() {
    if (!isRunning) return;

    let secondsLeft = 5;
    document.getElementById('timerDisplay').innerText = secondsLeft + "s";
    document.getElementById('statusText').innerText = "WAITING...";
    document.getElementById('signalOutput').className = "signal-output";
    document.getElementById('signalOutput').innerText = "Signal: —";
    document.getElementById('progressFill').style.width = "0%";

    let progress = 0;
    
    // Countdown tirsiga ilbiriqisyada
    countdownTimer = setInterval(() => {
      secondsLeft--;
      progress += 20;
      document.getElementById('progressFill').style.width = progress + "%";
      
      if (secondsLeft > 0) {
        document.getElementById('timerDisplay').innerText = secondsLeft + "s";
      } else {
        clearInterval(countdownTimer);
        document.getElementById('timerDisplay').innerText = "0s";
        document.getElementById('statusText').innerText = "ANALYZING...";
        
        // Soo saaridda Signal-ka (BUY ama SELL) kadib marka uu waqtigu dhamaado
        setTimeout(() => {
          if (!isRunning) return;
          const isCall = Math.random() > 0.5;
          const sigOutput = document.getElementById('signalOutput');
          
          if (isCall) {
            sigOutput.className = "signal-output call";
            sigOutput.innerText = "Signal: BUY (CALL 🟢)";
          } else {
            sigOutput.className = "signal-output put";
            sigOutput.innerText = "Signal: SELL (PUT 🔴)";
          }
          document.getElementById('statusText').innerText = "SIGNAL ACTIVE";
          
          // Dib u billaabida wareega xiga 6 ilbiriqsi kadib
          setTimeout(startBotLoop, 6000);
        }, 1000);
      }
    }, 1000);
  }

  // Bilow marka uu boggu furmo
  startBotLoop();
</script>

</body>
</html>
