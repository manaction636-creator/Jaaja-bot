<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SIGNAL - AI Trading Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #060918;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .neon-card {
      background: linear-gradient(180deg, #0d1538 0%, #090e26 100%);
      border: 1px solid #26397a;
      box-shadow: 0 0 30px rgba(56, 120, 255, 0.25);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-tag {
      font-size: 10px;
      color: #94a3b8;
    }

    .section-label {
      font-size: 10px;
      font-weight: 800;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      display: block;
    }

    /* Pair Pills */
    .pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill-btn {
      background: #111c44;
      border: 1px solid #233573;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn.active {
      background: linear-gradient(90deg, #2563eb, #9333ea);
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(147, 51, 234, 0.5);
    }

    /* Price Box */
    .price-box {
      background: #080d22;
      border: 1px solid #1e2f66;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .price-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .price-val {
      font-size: 18px;
      font-weight: 900;
      font-family: monospace;
      color: #38bdf8;
    }
