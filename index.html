<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <title>AI Signal Radar Demo</title>
  <style>
    body { background-color: #0d1117; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 300px; text-align: center; }
    .signal-box { background: #ff2a4b15; border: 2px solid #ff2a4b; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .signal-title { color: #ff2a4b; font-size: 22px; font-weight: bold; }
    .timer { font-size: 18px; margin-top: 10px; color: #e6edf3; }
    .btn { background: #238636; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h3>AUD/USD OTC</h3>
  <div class="signal-box" id="signalCard">
    <div class="signal-title" id="actionText">SCANNING...</div>
    <div class="timer" id="timerText">Next Candle: 10s</div>
  </div>
  <button class="btn" onclick="forceScan()">Force Scan Now</button>
</div>

<script>
  let timeLeft = 10;
  const timerText = document.getElementById('timerText');
  const actionText = document.getElementById('actionText');

  function startTimer() {
    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerText.innerText = `Next Candle: ${timeLeft}s`;
      } else {
        generateSignal();
        timeLeft = 30; // Reset saacada
      }
    }, 1000);
  }

  function generateSignal() {
    const signals = ['PUT (SELL 🔻)', 'CALL (BUY 🔺)'];
    const randomSignal = signals[Math.floor(Math.random() * signals.length)];
    actionText.innerText = randomSignal;
  }

  function forceScan() {
    actionText.innerText = "SCANNING MARKET...";
    timeLeft = 3;
  }

  startTimer();
</script>

</body>
</html>
