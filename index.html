<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Ai Bot - Pocket Option</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #080706;
      color: #f5e6d3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      max-height: 820px;
      background: radial-gradient(circle at 50% 25%, #1d140c 0%, #090807 75%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 28px 16px 36px;
      position: relative;
    }

    /* Header Brand */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 6px;
    }

    .ai-emblem {
      width: 54px;
      height: 54px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.55));
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #f3d5b5;
      letter-spacing: 0.4px;
    }

    .broker-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .broker-icon {
      width: 14px;
      height: 14px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 3px;
      display: inline-block;
    }

    /* Pair Carousel Selector */
    .pair-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0;
    }

    .pair-carousel {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .side-pair {
      font-size: 13px;
      font-weight: 700;
      color: #9ca3af;
      opacity: 0.65;
      cursor: pointer;
      padding: 8px 4px;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
    }

    .side-pair:active {
      transform: scale(0.95);
    }

    .active-pair-box {
      border: 1.5px solid #d97706;
      background: rgba(217, 119, 6, 0.08);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.18), inset 0 0 12px rgba(245, 158, 11, 0.08);
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 28px;
      font-weight: 900;
      color: #fef3c7;
      letter-spacing: 0.5px;
      text-align: center;
      cursor: pointer;
    }

    .otc-badge {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 800;
      color: #d6c5b3;
      letter-spacing: 1.5px;
    }

    /* Timeframe Display */
    .timeframe-display {
      font-size: 28px;
      font-weight: 900;
      color: #fef3c7;
      margin-top: 6px;
      cursor: pointer;
      padding: 4px 14px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .timeframe-display:active {
      background: rgba(255, 255, 255, 0.08);
    }

    .tf-hint {
      font-size: 10px;
      color: #78716c;
      margin-top: 2px;
    }

    /* Interactive Center Stage (Radial Orb + Result) */
    .center-stage {
      width: 100%;
      height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Radial Sunburst Orb */
    .orb-wrapper {
      width: 190px;
      height: 190px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .orb-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }

    .orb-wrapper.spinning .orb-svg {
      animation: spinOrb 2.2s linear infinite;
    }

    @keyframes spinOrb {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .scan-label {
      position: absolute;
      font-size: 32px;
      font-weight: 900;
      color: #fef3c7;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9), 0 0 18px rgba(249, 115, 22, 0.8);
      pointer-events: none;
    }

    .orb-wrapper.spinning .scan-label {
      font-size: 16px;
      letter-spacing: 2px;
      color: #fdba74;
    }

    /* Big Signal Result Display */
    .result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      animation: fadeInScale 0.3s ease forwards;
      cursor: pointer;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    .signal-word {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .signal-down {
      color: #f97316;
      text-shadow: 0 0 28px rgba(249, 115, 22, 0.45);
    }

    .signal-up {
      color: #22c55e;
      text-shadow: 0 0 28px rgba(34, 197, 94, 0.45);
    }

    .trend-line-svg {
      width: 240px;
      height: 55px;
      overflow: visible;
    }

    .reset-note {
      margin-top: 14px;
      font-size: 11px;
      color: #a8a29e;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="phone-frame">
  <!-- Top Brand Header -->
  <div class="brand-header">
    <svg class="ai-emblem" viewBox="0 0 64 64" fill="none">
      <path d="M32 6L35 16L45 14L38 22L46 29L36 28L34 38L29 29L19 32L25 23L18 15L28 17L32 6Z" fill="#d97706"/>
      <path d="M46 26L48 33L55 32L50 37L55 43L48 42L46 49L43 42L36 44L41 38L36 32L43 33L46 26Z" fill="#ea580c"/>
      <path d="M22 30L24 37L31 36L26 41L31 47L24 46L22 53L19 46L12 48L17 42L12 36L19 37L22 30Z" fill="#b45309"/>
    </svg>
    <div class="brand-title">Claude Ai Bot</div>
    <div class="broker-tag">
      <span class="broker-icon"></span>
      <span>Pocket Option</span>
    </div>
  </div>

  <!-- Pair Carousel Selector -->
  <div class="pair-section">
    <div class="pair-carousel">
      <div class="side-pair" id="prevPair" onclick="shiftPair(-1)">GBP/CHF</div>
      <div class="active-pair-box" id="activePair" onclick="shiftPair(1)">AUD/USD</div>
      <div class="side-pair" id="nextPair" onclick="shiftPair(1)">CAD/JPY</div>
    </div>
    <div class="otc-badge">OTC</div>
  </div>

  <!-- Timeframe (Default 30 sec) -->
  <div style="text-align: center;">
    <div class="timeframe-display" id="tfDisplay" onclick="cycleTimeframe()">30 sec</div>
    <div class="tf-hint">Taabo si aad waqtiga u beddesho</div>
  </div>

  <!-- Center Stage: Radial SCAN Orb OR Big UP/DOWN Signal -->
  <div class="center-stage">
    <!-- SCAN Radial Orb -->
    <div class="orb-wrapper" id="orbWrapper" onclick="startScan()">
      <svg class="orb-svg" id="orbSvg" viewBox="0 0 200 200"></svg>
      <div class="scan-label" id="scanLabel">SCAN</div>
    </div>

    <!-- Signal Output View -->
    <div class="result-view" id="resultView" onclick="resetToScan()">
      <div class="signal-word signal-down" id="signalWord">DOWN</div>
      <svg class="trend-line-svg" id="trendLineSvg" viewBox="0 0 240 55">
        <polyline id="trendPolyline" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="10,12 120,46 230,18"/>
      </svg>
      <div class="reset-note">Taabo si aad mar kale u SCAN garayso</div>
    </div>
  </div>
</div>

<script>
  const pairs = [
    "AUD/USD",
    "CAD/JPY",
    "EUR/USD",
    "GBP/USD",
    "USD/JPY",
    "CHF/JPY",
    "AUD/CAD",
    "USD/MXN",
    "GBP/CHF"
  ];
  let currentPairIndex = 0;

  // Waqtigu wuxuu ka bilaabmayaa 30 sec
  const timeframes = ["30 sec", "15 sec", "1 min", "5 sec", "5 min"];
  let currentTfIndex = 0;
  let isScanning = false;

  // Dhismaha Goobada Shucaaca Leh (Radial Spirograph Petals)
  function buildRadialOrb() {
    const svg = document.getElementById("orbSvg");
    const petalCount = 28;
    let markup = `<defs>
      <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f97316" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#ea580c" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#090807" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="85" fill="url(#coreGlow)"/>`;

    for (let i = 0; i < petalCount; i++) {
      const angle = (360 / petalCount) * i;
      markup += `<ellipse cx="100" cy="52" rx="11" ry="44" fill="none" stroke="#ea580c" stroke-width="1.3" stroke-opacity="0.8" transform="rotate(${angle} 100 100)"/>`;
    }
    markup += `<circle cx="100" cy="100" r="8" fill="#f97316"/>`;
    svg.innerHTML = markup;
  }

  function renderPairs() {
    const total = pairs.length;
    const prevIdx = (currentPairIndex - 1 + total) % total;
    const nextIdx = (currentPairIndex + 1) % total;

    document.getElementById("prevPair").innerText = pairs[prevIdx];
    document.getElementById("activePair").innerText = pairs[currentPairIndex];
    document.getElementById("nextPair").innerText = pairs[nextIdx];
  }

  function shiftPair(dir) {
    if (isScanning) return;
    const total = pairs.length;
    currentPairIndex = (currentPairIndex + dir + total) % total;
    renderPairs();
    resetToScan();
  }

  function cycleTimeframe() {
    if (isScanning) return;
    currentTfIndex = (currentTfIndex + 1) % timeframes.length;
    document.getElementById("tfDisplay").innerText = timeframes[currentTfIndex];
  }

  function startScan() {
    if (isScanning) return;
    isScanning = true;

    const orb = document.getElementById("orbWrapper");
    const label = document.getElementById("scanLabel");
    orb.classList.add("spinning");
    label.innerText = "SCANNING...";

    // 3 ilbiriqsi ayuu wareegayaa ka hor inta uusan signal-ka soo saarin
    setTimeout(() => {
      orb.classList.remove("spinning");
      orb.style.display = "none";

      const isUp = Math.random() > 0.5;
      const word = document.getElementById("signalWord");
      const poly = document.getElementById("trendPolyline");

      if (isUp) {
        word.innerText = "UP";
        word.className = "signal-word signal-up";
        poly.setAttribute("stroke", "#22c55e");
        poly.setAttribute("points", "10,44 120,12 230,36");
      } else {
        word.innerText = "DOWN";
        word.className = "signal-word signal-down";
        poly.setAttribute("stroke", "#f97316");
        poly.setAttribute("points", "10,12 120,46 230,18");
      }

      document.getElementById("resultView").style.display = "flex";
      isScanning = false;
    }, 3000);
  }

  function resetToScan() {
    isScanning = false;
    document.getElementById("resultView").style.display = "none";
    const orb = document.getElementById("orbWrapper");
    orb.style.display = "flex";
    orb.classList.remove("spinning");
    document.getElementById("scanLabel").innerText = "SCAN";
  }

  buildRadialOrb();
  renderPairs();
</script>

</body>
</html>
