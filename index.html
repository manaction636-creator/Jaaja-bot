<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUROBOT - Martingale Shield V2.4</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .terminal-card { background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 380px; padding: 20px; border: 1px solid #e5e7eb; }
        .header { text-align: center; margin-bottom: 12px; }
        .header h1 { font-size: 22px; font-weight: 900; color: #111827; }
        .header h1 span { color: #2563eb; }
        .header p { font-size: 11px; color: #6b7280; text-transform: uppercase; margin-top: 2px; }
        .pair-badge { display: inline-block; background: #eff6ff; color: #2563eb; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 12px; margin-top: 6px; }
        
        /* Martingale Step Box */
        .step-card {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #92400e;
        }

        /* Signal Box */
        .signal-box { border-radius: 16px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; }
        .signal-box.up { background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
        .signal-box.down { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .signal-box.stopped { background-color: #f3f4f6; border: 1px solid #d1d5db; color: #374151; }
        
        .signal-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; font-weight: bold; }
        .signal-box.up .signal-icon { background-color: #10b981; }
        .signal-box.down .signal-icon { background-color: #ef4444; }
        .signal-box.stopped .signal-icon { background-color: #6b7280; }
        
        .signal-text { font-size: 14px; font-weight: 800; }

        .details-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; font-size: 12px; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; color: #4b5563; }
        .detail-label { color: #6b7280; }
        .detail-value { font-weight: 700; color: #111827; }

        .confidence-bar-bg { height: 6px; background: #e5e7eb; border-radius: 10px; overflow: hidden; margin-top: 4px; }
        .confidence-fill { height: 100%; width: 0%; border-radius: 10px; transition: width 0.5s ease; background-color: #10b981; }

        .reason-box { background: #f9fafb; border-radius: 10px; padding: 10px; font-size: 11px; color: #6b7280; border: 1px solid #f3f4f6; margin-bottom: 12px; }
        
        .controls { display: flex; flex-direction: column; gap: 8px; }
        select { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; font-size: 12px; outline: none; color: #374151; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .scan-btn { background: #2563eb; color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: background 0.2s; }
        .scan-btn:hover { background: #1d4ed8; }
        .scan-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .reset-btn { background: #ef4444; }
        .reset-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="header">
        <h1>NEURO<span>BOT</span></h1>
        <p>Martingale Shield V2.4</p>
        <div class="pair-badge" id="pairDisplay">CAD/CHF (OTC) • 1m</div>
    </div>

    <!-- Martingale Step Indicator -->
    <div class="step-card" id="stepCard">
        <span>TALLAABADA (STEP): <strong id="stepText">STEP 1 (CANDLE 1)</strong></span>
        <span id="stepStatus" style="color: #d97706;">ACTIVE</span>
    </div>

    <!-- Signal Box -->
    <div class="signal-box down" id="signalBox">
        <div class="signal-icon" id="signalIcon">↓</div>
        <div class="signal-text" id="signalTitle">Your signal is DOWN</div>
    </div>

    <!-- Details -->
    <div class="details-list">
        <div class="detail-item"><span class="detail-label">📊 Pair</span><span class="detail-value" id="pairVal">CAD/CHF (OTC)</span></div>
        <div class="detail-item"><span class="detail-label">📈 Trend Mode</span><span class="detail-value" id="trendVal">Downtrend Locked</span></div>
        <div class="detail-item"><span class="detail-label">⏱️ Expiry</span><span class="detail-value">1 Minute</span></div>
        <div class="detail-item" style="flex-direction: column; align-items: flex-start;">
            <div style="display:flex; justify-content:space-between; width:100%;">
                <span class="detail-label">🎯 Confidence</span>
                <span class="detail-value" id="confidenceVal">95%</span>
            </div>
            <div class="confidence-bar-bg" style="width:100%;">
                <div class="confidence-fill" id="confidenceFill" style="width: 95%;"></div>
            </div>
        </div>
    </div>

    <!-- Reason Box -->
    <div class="reason-box">
        <strong>💬 Xaaladda:</strong> <span id="reasonText">Candle 1 & 2 waa la oggol yahay. Step 3 waa la xirayaa.</span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <select id="assetSelect">
            <option value="CAD/CHF (OTC)">CAD/CHF (OTC)</option>
            <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
            <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
        </select>

        <select id="manualTrendSelect">
            <option value="DOWN">🔴 Force DOWN (SELL Only)</option>
            <option value="UP">🟢 Force UP (BUY Only)</option>
        </select>

        <div class="btn-group">
            <button class="scan-btn" id="scanBtn" onclick="nextMartingaleStep()">NEXT STEP / SCAN</button>
            <button class="scan-btn reset-btn" onclick="resetSteps()">RESET (STEP 1)</button>
        </div>
    </div>
</div>

<script>
    let currentStep = 1; // 1 = Candle 1, 2 = Candle 2, 3 = Stop

    function nextMartingaleStep() {
        const btn = document.getElementById("scanBtn");
        const stepText = document.getElementById("stepText");
        const stepStatus = document.getElementById("stepStatus");
        const stepCard = document.getElementById("stepCard");
        const signalBox = document.getElementById("signalBox");
        const signalIcon = document.getElementById("signalIcon");
        const signalTitle = document.getElementById("signalTitle");
        const reasonText = document.getElementById("reasonText");
        
        if (currentStep === 1) {
            currentStep = 2;
            stepText.innerText = "STEP 2 (CANDLE 2)";
            stepStatus.innerText = "WARNING";
            stepCard.style.background = "#fff7ed";
            stepCard.style.borderColor = "#ffedd5";
            reasonText.innerText = "Waxaad joogtaa Candle 2 (Martingale Step 2). Si taxadar leh u gal.";
        } else if (currentStep === 2) {
            currentStep = 3;
            stepText.innerText = "STEP 3 (HARD STOP)";
            stepStatus.innerText = "LOCKED";
            stepCard.style.background = "#fef2f2";
            stepCard.style.borderColor = "#fecaca";
            stepCard.style.color = "#991b1b";
            
            signalBox.className = "signal-box stopped";
            signalIcon.innerText = "🛑";
            signalTitle.innerText = "TRADING STOPPED AT STEP 3";
            reasonText.innerText = "HALKAAN WAA LA JOOJINAYAA! Candle 3 lama galayo si aan lacag looga lumin.";
            
            btn.disabled = true;
            btn.innerText = "LOCKED (RESET REQUIRED)";
            return;
        }

        // Simulate analysis for Step 1 or 2
        btn.disabled = true;
        btn.innerText = "ANALYZING...";
        setTimeout(() => {
            const asset = document.getElementById("assetSelect").value;
            const trend = document.getElementById("manualTrendSelect").value;
            document.getElementById("pairDisplay").innerText = asset + " • 1m";
            document.getElementById("pairVal").innerText = asset;

            if (trend === "UP") {
                signalBox.className = "signal-box up";
                signalIcon.innerText = "↑";
                signalTitle.innerText = "Your signal is UP (Step " + (currentStep - 1) + ")";
            } else {
                signalBox.className = "signal-box down";
                signalIcon.innerText = "↓";
                signalTitle.innerText = "Your signal is DOWN (Step " + (currentStep - 1) + ")";
            }
            btn.disabled = false;
            btn.innerText = "NEXT STEP / SCAN";
        }, 800);
    }

    function resetSteps() {
        currentStep = 1;
        const btn = document.getElementById("scanBtn");
        const stepText = document.getElementById("stepText");
        const stepStatus = document.getElementById("stepStatus");
        const stepCard = document.getElementById("stepCard");
        const signalBox = document.getElementById("signalBox");
        const signalIcon = document.getElementById("signalIcon");
        const signalTitle = document.getElementById("signalTitle");
        const reasonText = document.getElementById("reasonText");

        stepText.innerText = "STEP 1 (CANDLE 1)";
        stepStatus.innerText = "ACTIVE";
        stepStatus.style.color = "#d97706";
        stepCard.style.background = "#fffbeb";
        stepCard.style.borderColor = "#fde68a";
        stepCard.style.color = "#92400e";

        signalBox.className = "signal-box down";
        signalIcon.innerText = "↓";
        signalTitle.innerText = "Your signal is DOWN";
        reasonText.innerText = "Dib ayaa loo bilaabay. Candle 1 & 2 waa la oggol yahay.";
        
        btn.disabled = false;
        btn.innerText = "NEXT STEP / SCAN";
    }
</script>

</body>
</html>
