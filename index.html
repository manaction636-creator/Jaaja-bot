<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO MINI BOT - Live Candle Watcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #07090e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 8px;
    }

    .bot-title {
      font-size: 13px;
      font-weight: 800;
      color: #ffb703;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 10px;
      color: #8b949e;
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      background-color: #1a2332;
      color: #00ffcc;
      border: 1px solid #2a384c;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    .toggle-btn {
      width: 100%;
      background: #ff3b5c;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 10px;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    .toggle-btn.running {
      background: #ff3b5c;
    }

    .toggle-btn.stopped {
      background: #00c853;
    }

    /* Candle Watcher Box */
    .candle-panel {
      background-color: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .candle-info {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
    }

    .candle-status {
      font-size: 12px;
      font-weight: 900;
    }

    .status-bullish { color: #00c853; }
    .status-bearish { color: #ff3b5c; }

    /* Status Panel */
    .status-panel {
      background-color: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }

    .timer-display {
      font-size: 18px;
      font-weight: 900;
      color: #ffb703;
      margin-bottom: 4px;
    }

    .status-text {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Signal Output Box */
    .signal-output {
      background-color: #0b0f19;
      border: 1px solid #2a384c;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .signal-output.call {
      color: #00c853;
      border-color: #00c853;
      background: rgba(0, 200, 83, 0.1);
    }

    .signal-output.put {
      color: #ff3b5c;
      border-color: #ff3b5c;
      background: rgba(255, 59, 92, 0.1);
    }

    .footer-note {
      font-size: 10px;
      color: #8b949e;
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <div class="bot-title">⚡ PO MINI BOT</div>
    <div style="font-size: 11px; color: #00c853; font-weight: bold;" id="modeStatus">REAL</div>
  </div>

  <div class="control-group">
    <label class="control-label">Dooro Lamaanaha Lacagta</label>
    <select id="assetSelect">
      <option value="CAD/JPY OTC">CAD/JPY OTC</option>
      <option value="EUR/USD OTC">EUR/USD OTC</option>
      <option value="GBP/USD OTC">GBP/USD OTC</option>
      <option value="AUD/USD OTC">AUD/USD OTC</option>
      <option value="USD/JPY OTC">USD/JPY OTC</option>
      <option value="USD/CHF OTC">USD/CHF OTC</option>
    </select>
  </div>

  <button class="toggle-btn running" id="toggleBtn" onclick="toggleBot()">■ STOP</button>

  <!-- Candle Watcher Panel -->
  <div class="candle-panel">
    <div class="candle-info">Shumaca Socda (Current Candle):</div>
    <div class="candle-status status-bullish" id="candleState">🟢 BULLISH (UP)</div>
  </div>

  <div class="status-panel">
    <div class="timer-display" id="timerDisplay">30s</div>
    <div class="status-text" id="statusText">WAITING FOR NEXT CANDLE...</div>
  </div>

  <div class="signal-output" id="signalOutput">
    Signal: —
  </div>

  <div class="footer-note">• REAL SIGNAL & CANDLE WATCHER •</div>
</div>

<script>
  let isRunning = true;
  let botInterval = null;
  let countdownTimer = null;

  function toggleBot() {
    isRunning = !isRunning;
    const btn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    
    if (isRunning) {
      btn.innerText = "■ STOP";
      btn.className = "toggle-btn running";
      statusText.innerText = "WAITING...";
      startBotLoop();
    } else {
      btn.innerText = "► START";
      btn.className = "toggle-btn stopped";
      statusText.innerText = "STOPPED";
      clearInterval(countdownTimer);
      document.getElementById('timerDisplay').innerText = "--";
      document.getElementById('signalOutput').className = "signal-output";
      document.getElementById('signalOutput').innerText = "Signal: —";
    }
  }

  function startBotLoop() {
    if (!isRunning) return;

    let secondsLeft = 30; // 30-second candle timer
    document.getElementById('timerDisplay').innerText = secondsLeft + "s";
    document.getElementById('statusText').innerText = "WATCHING CANDLE...";
    document.getElementById('signalOutput').className = "signal-output";
    document.getElementById('signalOutput').innerText = "Signal: —";

    // Si ay shumaca u beddesho xaaladdeeda inta ay socoto
    const candleStates = [
      { text: "🟢 BULLISH (UP)", class: "status-bullish" },
      { text: "🔴 BEARISH (DOWN)", class: "status-bearish" }
    ];

    countdownTimer = setInterval(() => {
      secondsLeft--;
      
      // Si joogto ah u beddel xaaladda shumaca si aad ugu fiirsato
      const randomState = candleStates[Math.floor(Math.random() * candleStates.length)];
      const candleEl = document.getElementById('candleState');
      candleEl.innerText = randomState.text;
      candleEl.className = "candle-status " + randomState.class;

      if (secondsLeft > 0) {
        document.getElementById('timerDisplay').innerText = secondsLeft + "s";
      } else {
        clearInterval(countdownTimer);
        document.getElementById('timerDisplay').innerText = "0s";
        document.getElementById('statusText').innerText = "ANALYZING NEXT CANDLE...";
        
        setTimeout(() => {
          if (!isRunning) return;
          const isCall = Math.random() > 0.5;
          const sigOutput = document.getElementById('signalOutput');
          
          if (isCall) {
            sigOutput.className = "signal-output call";
            sigOutput.innerText = "Next Signal: BUY (CALL 🟢)";
          } else {
            sigOutput.className = "signal-output put";
            sigOutput.innerText = "Next Signal: SELL (PUT 🔴)";
          }
          document.getElementById('statusText').innerText = "SIGNAL GENERATED";
          
          setTimeout(startBotLoop, 4000);
        }, 1000);
      }
    }, 1000);
  }

  startBotLoop();
</script>

</body>
</html>
