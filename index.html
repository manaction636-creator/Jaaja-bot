<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDelayX - Single Signal Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #07090e;
      color: #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #0f141f;
      border: 1px solid #ff2a4b;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #8b949e;
    }

    .section-title {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* Market Selector */
    .market-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .market-btn {
      flex: 1;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .market-btn.active {
      background-color: #00ffcc;
      color: #07090e;
      border-color: #00ffcc;
    }

    /* Asset Dropdown */
    .asset-select {
      width: 100%;
      background-color: #161b22;
      color: #00ffcc;
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      outline: none;
      cursor: pointer;
    }

    /* Expiry Time Buttons */
    .expiry-container {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .exp-btn {
      flex: 1;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 2px;
      font-size: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .exp-btn.active {
      background-color: #00ffcc;
      color: #07090e;
      border-color: #00ffcc;
    }

    /* Scan Action Button */
    .scan-btn {
      width: 100%;
      background: linear-gradient(90deg, #ff9900, #ffcc00);
      color: #07090e;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* Single Big Signal Box */
    .signal-display-box {
      background-color: #07090e;
      border: 2px dashed #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .signal-display-box.call {
      background-color: rgba(0, 255, 204, 0.1);
      border: 2px solid #00ffcc;
    }

    .signal-display-box.put {
      background-color: rgba(255, 42, 75, 0.1);
      border: 2px solid #ff2a4b;
    }

    .signal-main-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 4px;
      color: #8b949e;
    }

    .signal-display-box.call .signal-main-text {
      color: #00ffcc;
    }

    .signal-display-box.put .signal-main-text {
      color: #ff2a4b;
    }

    .signal-sub-text {
      font-size: 12px;
      color: #c9d1d9;
    }

    /* System Logs Box */
    .logs-box {
      background-color: #05070a;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      height: 90px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #00ffcc;
      text-align: left;
    }

    .log-item {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🛡️ AIDelayX Single Visualizer</span>
    <span id="liveClock">17:11:32</span>
  </div>

  <!-- Select Market -->
  <div class="section-title">Select Market</div>
  <div class="market-container">
    <button class="market-btn" onclick="setMarket('REGULAR', this)">REGULAR</button>
    <button class="market-btn active" onclick="setMarket('OTC', this)">OTC</button>
  </div>

  <!-- Select Asset Dropdown -->
  <div class="section-title">Select Currency Pair</div>
  <select id="assetSelect" class="asset-select">
    <option value="EUR/USD">EUR/USD</option>
    <option value="AUD/USD">AUD/USD</option>
    <option value="GBP/USD">GBP/USD</option>
    <option value="USD/JPY">USD/JPY</option>
    <option value="EUR/GBP">EUR/GBP</option>
    <option value="USD/CHF">USD/CHF</option>
  </select>

  <!-- Select Expiry Time -->
  <div class="section-title">Select Expiration Time</div>
  <div class="expiry-container">
    <button class="exp-btn" onclick="setExpiry('5s', this)">5s</button>
    <button class="exp-btn active" onclick="setExpiry('15s', this)">15s</button>
    <button class="exp-btn" onclick="setExpiry('30s', this)">30s</button>
    <button class="exp-btn" onclick="setExpiry('M1', this)">M1</button>
    <button class="exp-btn" onclick="setExpiry('M3', this)">M3</button>
    <button class="exp-btn" onclick="setExpiry('M5', this)">M5</button>
  </div>

  <!-- Action Button -->
  <button class="scan-btn" onclick="startScanning()">START SCANNING</button>

  <!-- Single Signal Box -->
  <div class="signal-display-box" id="signalBox">
    <div class="signal-main-text" id="signalMainText">READY</div>
    <div class="signal-sub-text" id="signalSubText">Select asset and scan</div>
  </div>

  <!-- System Logs -->
  <div class="section-title" style="text-align: left;">System Log</div>
  <div class="logs-box" id="systemLogs">
    <div class="log-item">[17:11:32] Visualizer ready.</div>
  </div>
</div>

<script>
  // Saacadda kore
  setInterval(() => {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
  }, 1000);

  function setMarket(market, btn) {
    document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    addLog(`Market switched to: ${market}`);
  }

  function setExpiry(exp, btn) {
    document.querySelectorAll('.exp-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    addLog(`Expiration timeframe set to: ${exp}`);
  }

  function addLog(text) {
    const logsBox = document.getElementById('systemLogs');
    const timeStr = new Date().toTimeString().split(' ')[0];
    logsBox.innerHTML += `<div class="log-item">[${timeStr}] ${text}</div>`;
    logsBox.scrollTop = logsBox.scrollHeight;
  }

  function startScanning() {
    const selectedAsset = document.getElementById('assetSelect').value;
    const signalBox = document.getElementById('signalBox');
    const mainText = document.getElementById('signalMainText');
    const subText = document.getElementById('signalSubText');

    mainText.innerText = "SCANNING...";
    subText.innerText = `Analyzing ${selectedAsset}...`;
    signalBox.className = "signal-display-box";

    addLog(`Connecting to WebSocket for ${selectedAsset}...`);

    setTimeout(() => {
      addLog("WebSocket connected | Low-latency established");
    }, 500);

    setTimeout(() => {
      // Kala doorasho random ah oo u dhaxeysa BUY iyo SELL si uu hal mar u soo saaro
      const isCall = Math.random() > 0.5;

      if (isCall) {
        mainText.innerText = "BUY (CALL 🟢)";
        signalBox.className = "signal-display-box call";
        subText.innerText = `${selectedAsset} - Confidence: 98%`;
        addLog(`DETECT: Bullish pattern confirmed on ${selectedAsset}`);
      } else {
        mainText.innerText = "SELL (PUT 🔴)";
        signalBox.className = "signal-display-box put";
        subText.innerText = `${selectedAsset} - Confidence: 96%`;
        addLog(`DETECT: Bearish rejection detected on ${selectedAsset}`);
      }
      addLog("MODULE: Predictive Noise Filter (PNF) executed.");
    }, 1200);
  }
</script>

</body>
</html>
