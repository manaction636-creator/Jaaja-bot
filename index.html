<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA PULSE V3 - Smart Signal Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #05070c;
      color: #f0f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .terminal-card {
      background: #0d121d;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.85);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .app-name {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #f59e0b;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .box-dark {
      background: #131b2c;
      border: 1px solid #23304a;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .mini-label {
      font-size: 9px;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
      display: block;
    }

    select.pair-select {
      width: 100%;
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    select.pair-select option {
      background: #0d121d;
      color: #f8fafc;
    }

    .price-readout {
      font-size: 13px;
      font-weight: 900;
      font-family: monospace;
      color: #fbbf24;
      margin-top: 2px;
    }

    .tf-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 12px;
    }

    .tf-chip {
      background: #131b2c;
      border: 1px solid #23304a;
      color: #94a3b8;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .tf-chip.active {
      background: #f59e0b;
      border-color: #fbbf24;
      color: #090d16;
    }

    .signal-stage {
      background: #111827;
      border: 1px solid #26334d;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .signal-word {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .word-buy { color: #10b981; }
    .word-sell { color: #f43f5e; }
    .word-scan { color: #fbbf24; font-size: 17px; padding: 6px 0; }

    .confidence-text {
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .meter-track {
      width: 100%;
      height: 5px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
    }

    .meter-fill {
      width: 65%;
      height: 100%;
      background: #10b981;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .metrics-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric-tile {
      background: #131b2c;
      border: 1px solid #23304a;
      border-radius: 9px;
      padding: 8px;
      text-align: center;
    }

    .metric-val {
      font-size: 12px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 2px;
    }

    .btn-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .action-btn {
      padding: 11px;
      border-radius: 9px;
      border: none;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-analyze {
      background: #f59e0b;
      color: #090d16;
    }

    .btn-clear {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    .btn-call {
      background: #059669;
      color: #ffffff;
    }

    .btn-put {
      background: #e11d48;
      color: #ffffff;
    }

    .auto-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #131b2c;
      border: 1px solid #23304a;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 11px;
      color: #cbd5e1;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #334155;
      border-radius: 20px;
      transition: 0.25s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: #ffffff;
      border-radius: 50%;
      transition: 0.25s;
    }

    input:checked + .slider { background: #f59e0b; }
    input:checked + .slider:before { transform: translateX(16px); }

    .toast-banner {
      position: fixed;
      bottom: 18px;
      background: #f59e0b;
      color: #090d16;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .toast-banner.visible { opacity: 1; }
  </style>
</head>
<body>

<div class="terminal-card">
  <div class="top-header">
    <div class="app-name">⚡ AURA PULSE V3</div>
    <div class="status-pill" id="liveTag">● LIVE FEED</div>
  </div>

  <div class="row-2">
    <div class="box-dark">
      <span class="mini-label">Market Pair</span>
      <select class="pair-select" id="pairSelect" onchange="runMarketScan()">
        <option value="EUR/USD OTC">EUR/USD OTC</option>
        <option value="GBP/USD OTC">GBP/USD OTC</option>
        <option value="AUD/USD OTC">AUD/USD OTC</option>
        <option value="USD/JPY OTC">USD/JPY OTC</option>
        <option value="CHF/JPY OTC">CHF/JPY OTC</option>
        <option value="AUD/CAD OTC">AUD/CAD OTC</option>
        <option value="USD/MXN OTC">USD/MXN OTC</option>
        <option value="CAD/JPY OTC">CAD/JPY OTC</option>
        <option value="EUR/USD">EUR/USD</option>
        <option value="GBP/USD">GBP/USD</option>
      </select>
    </div>
    <div class="box-dark">
      <span class="mini-label">Spot Price</span>
      <div class="price-readout" id="spotPrice">1.08420</div>
    </div>
  </div>

  <div class="tf-strip">
    <div class="tf-chip" data-sec="5" onclick="pickTf(this)">5s</div>
    <div class="tf-chip" data-sec="15" onclick="pickTf(this)">15s</div>
    <div class="tf-chip active" data-sec="30" onclick="pickTf(this)">30s</div>
    <div class="tf-chip" data-sec="60" onclick="pickTf(this)">1m</div>
    <div class="tf-chip" data-sec="300" onclick="pickTf(this)">5m</div>
  </div>

  <div class="signal-stage">
    <div class="stage-top">
      <span id="stagePair">EUR/USD OTC · 30s</span>
      <span>Expiry: <strong id="expiryClock" style="color:#fbbf24;">30s</strong></span>
    </div>
    <div class="signal-word word-buy" id="signalWord">BUY</div>
    <div class="confidence-text" id="confidenceText">Confirmation: 78% · Strong Consensus</div>
    <div class="meter-track">
      <div class="meter-fill" id="meterFill"></div>
    </div>
  </div>

  <div class="metrics-3">
    <div class="metric-tile">
      <span class="mini-label">RSI (14)</span>
      <div class="metric-val" id="mRsi">62.4</div>
    </div>
    <div class="metric-tile">
      <span class="mini-label">Momentum</span>
      <div class="metric-val" id="mMom" style="color:#34d399;">Bullish</div>
    </div>
    <div class="metric-tile">
      <span class="mini-label">Candle Bias</span>
      <div class="metric-val" id="mCandle">Green Engulf</div>
    </div>
  </div>

  <div class="btn-pair">
    <button class="action-btn btn-analyze" onclick="runMarketScan()">Scan Candle</button>
    <button class="action-btn btn-clear" onclick="resetStage()">Reset</button>
  </div>

  <div class="btn-pair">
    <button class="action-btn btn-call" onclick="notifyAction('CALL')">▲ CALL</button>
    <button class="action-btn btn-put" onclick="notifyAction('PUT')">▼ PUT</button>
  </div>

  <div class="auto-bar">
    <span>Auto-scan on candle close</span>
    <label class="switch">
      <input type="checkbox" id="autoScanSwitch" onchange="handleAutoSwitch()">
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="toast-banner" id="toastBanner">Action Ready</div>

<script>
  let currentSec = 30;
  let timerId = null;
  let scanning = false;

  function showBanner(text) {
    const el = document.getElementById('toastBanner');
    el.innerText = text;
    el.classList.add('visible');
    setTimeout(() => el.classList.remove('visible'), 1800);
  }

  function pickTf(el) {
    document.querySelectorAll('.tf-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    currentSec = parseInt(el.dataset.sec, 10);
    restartClock();
    runMarketScan();
  }

  function restartClock() {
    if (timerId) clearInterval(timerId);
    let left = currentSec;
    const pair = document.getElementById('pairSelect').value;
    const tfLabel = document.querySelector('.tf-chip.active').innerText;
    document.getElementById('stagePair').innerText = `${pair} · ${tfLabel}`;
    document.getElementById('expiryClock').innerText = `${left}s`;

    timerId = setInterval(() => {
      left--;
      if (left > 0) {
        document.getElementById('expiryClock').innerText = `${left}s`;
      } else {
        left = currentSec;
        document.getElementById('expiryClock').innerText = `${left}s`;
        if (document.getElementById('autoScanSwitch').checked) {
          runMarketScan();
        }
      }
    }, 1000);
  }

  function runMarketScan() {
    if (scanning) return;
    scanning = true;

    const pair = document.getElementById('pairSelect').value;
    const tfLabel = document.querySelector('.tf-chip.active').innerText;
    const wordEl = document.getElementById('signalWord');
    const confEl = document.getElementById('confidenceText');
    const fillEl = document.getElementById('meterFill');

    document.getElementById('stagePair').innerText = `${pair} · ${tfLabel}`;
    wordEl.className = 'signal-word word-scan';
    wordEl.innerText = 'SCANNING CANDLE...';
    confEl.innerText = 'Checking price action & momentum';
    fillEl.style.width = '45%';
    fillEl.style.background = '#fbbf24';

    setTimeout(() => {
      const isBuy = Math.random() > 0.5;
      const score = Math.floor(Math.random() * 26) + 70; // 70% - 95%
      const price = (Math.random() * 0.7 + 0.95).toFixed(5);

      document.getElementById('spotPrice').innerText = price;
      fillEl.style.width = `${score}%`;

      if (isBuy) {
        wordEl.className = 'signal-word word-buy';
        wordEl.innerText = 'BUY';
        confEl.innerText = `Confirmation: ${score}% · Bullish Setup`;
        fillEl.style.background = '#10b981';
        document.getElementById('mRsi').innerText = (Math.random() * 14 + 58).toFixed(1);
        document.getElementById('mMom').innerText = 'Bullish';
        document.getElementById('mMom').style.color = '#34d399';
        document.getElementById('mCandle').innerText = 'Bullish Pin';
      } else {
        wordEl.className = 'signal-word word-sell';
        wordEl.innerText = 'SELL';
        confEl.innerText = `Confirmation: ${score}% · Bearish Setup`;
        fillEl.style.background = '#f43f5e';
        document.getElementById('mRsi').innerText = (Math.random() * 14 + 26).toFixed(1);
        document.getElementById('mMom').innerText = 'Bearish';
        document.getElementById('mMom').style.color = '#fb7185';
        document.getElementById('mCandle').innerText = 'Bearish Drop';
      }

      scanning = false;
      restartClock();
    }, 1800);
  }

  function resetStage() {
    if (timerId) clearInterval(timerId);
    scanning = false;
    document.getElementById('signalWord').className = 'signal-word word-scan';
    document.getElementById('signalWord').innerText = 'PAUSED';
    document.getElementById('confidenceText').innerText = 'Press Scan Candle to resume';
    document.getElementById('meterFill').style.width = '0%';
    document.getElementById('expiryClock').innerText = '--';
  }

  function notifyAction(side) {
    const pair = document.getElementById('pairSelect').value;
    showBanner(`${side} marked for ${pair}`);
  }

  function handleAutoSwitch() {
    const active = document.getElementById('autoScanSwitch').checked;
    showBanner(active ? 'Auto-scan ON' : 'Auto-scan OFF');
    if (active) runMarketScan();
  }

  restartClock();
</script>

</body>
</html>
