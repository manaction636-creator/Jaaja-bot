<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Pattern Visualizer - AIDelayX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #07090e;
      color: #00ffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #0f141f;
      border: 1px solid #ff2a4b;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #8b949e;
    }

    .section-title {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    /* Market Selector */
    .market-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .market-btn {
      flex: 1;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .market-btn.active {
      background-color: #00ffcc;
      color: #07090e;
      border-color: #00ffcc;
    }

    /* Expiry Time Buttons */
    .expiry-container {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .exp-btn {
      flex: 1;
      background-color: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 2px;
      font-size: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .exp-btn.active {
      background-color: #00ffcc;
      color: #07090e;
      border-color: #00ffcc;
    }

    /* Scan Action Button */
    .scan-btn {
      width: 100%;
      background: linear-gradient(90deg, #ff9900, #ffcc00);
      color: #07090e;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* Radar / Grid Screen */
    .radar-box {
      background-color: #07090e;
      border: 1px solid #00ffcc44;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .pair-card {
      background-color: #121824;
      border: 1px solid #1f293d;
      padding: 6px 4px;
      border-radius: 4px;
      font-size: 10px;
    }

    .pair-name {
      color: #ffffff;
      font-weight: bold;
    }

    .pair-status {
      color: #8b949e;
      font-size: 9px;
    }

    /* System Logs Box */
    .logs-box {
      background-color: #05070a;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      height: 100px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 10px;
      color: #00ffcc;
      text-align: left;
    }

    .log-item {
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span>🛡️ Real-Time Pattern Visualizer</span>
    <span id="liveClock">21:45:00</span>
  </div>

  <!-- Select Market -->
  <div class="section-title">Select Market</div>
  <div class="market-container">
    <button class="market-btn" onclick="setMarket('REGULAR', this)">REGULAR</button>
    <button class="market-btn active" onclick="setMarket('OTC', this)">OTC</button>
  </div>

  <!-- Select Expiry Time -->
  <div class="section-title">Select Expiration Time</div>
  <div class="expiry-container">
    <button class="exp-btn" onclick="setExpiry('5s', this)">5s</button>
    <button class="exp-btn active" onclick="setExpiry('15s', this)">15s</button>
    <button class="exp-btn" onclick="setExpiry('30s', this)">30s</button>
    <button class="exp-btn" onclick="setExpiry('M1', this)">M1</button>
    <button class="exp-btn" onclick="setExpiry('M3', this)">M3</button>
    <button class="exp-btn" onclick="setExpiry('M5', this)">M5</button>
  </div>

  <!-- Action Button -->
  <button class="scan-btn" onclick="startScanning()">START SCANNING</button>

  <!-- Radar / Multi-Pair Display -->
  <div class="radar-box">
    <div style="font-size: 11px; color: #8b949e;" id="radarStatus">Analyzing currency pairs...</div>
    <div class="pairs-grid">
      <div class="pair-card"><div class="pair-name">EUR/USD</div><div class="pair-status" id="p1">WAITING</div></div>
      <div class="pair-card"><div class="pair-name">AUD/USD</div><div class="pair-status" id="p2">WAITING</div></div>
      <div class="pair-card"><div class="pair-name">GBP/USD</div><div class="pair-status" id="p3">WAITING</div></div>
      <div class="pair-card"><div class="pair-name">USD/JPY</div><div class="pair-status" id="p4">WAITING</div></div>
      <div class="pair-card"><div class="pair-name">EUR/GBP</div><div class="pair-status" id="p5">WAITING</div></div>
      <div class="pair-card"><div class="pair-name">USD/CHF</div><div class="pair-status" id="p6">WAITING</div></div>
    </div>
  </div>

  <!-- System Logs -->
  <div class="section-title" style="text-align: left;">System Log</div>
  <div class="logs-box" id="systemLogs">
    <div class="log-item">[21:45:00] AIDelayX initialized...</div>
    <div class="log-item">[21:45:02] Ready for user command.</div>
  </div>
</div>

<script>
  // Saacadda kore ee socota
  setInterval(() => {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
  }, 1000);

  function setMarket(market, btn) {
    document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    addLog(`Market switched to: ${market}`);
  }

  function setExpiry(exp, btn) {
    document.querySelectorAll('.exp-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    addLog(`Expiration timeframe set to: ${exp}`);
  }

  function addLog(text) {
    const logsBox = document.getElementById('systemLogs');
    const timeStr = new Date().toTimeString().split(' ')[0];
    logsBox.innerHTML += `<div class="log-item">[${timeStr}] ${text}</div>`;
    logsBox.scrollTop = logsBox.scrollHeight;
  }

  function startScanning() {
    document.getElementById('radarStatus').innerText = "Connecting to WebSocket...";
    addLog("Connecting to Pocket Option... 40%");
    
    setTimeout(() => {
      addLog("Connecting to Pocket Option... 100%");
      addLog("WebSocket connected | Low-latency channel established");
    }, 600);

    setTimeout(() => {
      document.getElementById('radarStatus').innerText = "Deep market pattern analysis active";
      addLog("Deep market analysis via WebSocket | AI signal detection active");
      
      // Soo saar xaaladaha pair-yada
      document.getElementById('p1').innerText = "CALL 🟢";
      document.getElementById('p1').style.color = "#00ffcc";
      
      document.getElementById('p2').innerText = "PUT 🔴";
      document.getElementById('p2').style.color = "#ff2a4b";

      document.getElementById('p3').innerText = "SCANNING";
      document.getElementById('p4').innerText = "CALL 🟢";
      document.getElementById('p5').innerText = "PUT 🔴";
      document.getElementById('p6').innerText = "SCANNING";

      addLog("DETECT: Anomaly detected in EUR/USD OTC...");
      addLog("MODULE: Predictive Noise Filter (PNF) active.");
      addLog("CONFIDENCE INDEX: 97%");
    }, 1500);
  }
</script>

</body>
</html>
