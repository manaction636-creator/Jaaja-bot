<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUROBOT - AI SIGNAL TERMINAL V2.0</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .terminal-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #111827;
        }
        .header h1 span {
            color: #2563eb;
        }
        .header p {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        
        .pair-badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .signal-box {
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .signal-box.up {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
        .signal-box.down {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .signal-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            font-weight: bold;
        }
        .signal-box.up .signal-icon { background-color: #10b981; }
        .signal-box.down .signal-icon { background-color: #ef4444; }
        
        .signal-text {
            font-size: 16px;
            font-weight: 800;
        }

        .details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #4b5563;
        }
        .detail-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
        }
        .detail-value {
            font-weight: 700;
            color: #111827;
        }

        .confidence-wrapper {
            margin-top: 4px;
        }
        .confidence-bar-bg {
            height: 6px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .confidence-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .up .confidence-fill { background-color: #10b981; }
        .down .confidence-fill { background-color: #ef4444; }

        .reason-box {
            background: #f9fafb;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 11px;
            color: #6b7280;
            border: 1px solid #f3f4f6;
            margin-bottom: 15px;
        }
        .reason-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #fff;
            font-size: 12px;
            outline: none;
            color: #374151;
        }
        .scan-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scan-btn:hover { background: #1d4ed8; }
        .scan-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #f3f4f6;
            font-size: 10px;
            color: #9ca3af;
            text-align: center;
        }
        .nav-item { cursor: pointer; }
        .nav-item.active { color: #2563eb; font-weight: bold; }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="header">
        <h1>NEURO<span>BOT</span></h1>
        <p>AI Signal Terminal v2.0</p>
        <div class="pair-badge" id="pairDisplay">CAD/CHF (OTC) • 5s</div>
    </div>

    <!-- Dynamic Signal Box -->
    <div class="signal-box down" id="signalBox">
        <div class="signal-icon" id="signalIcon">↓</div>
        <div class="signal-text" id="signalTitle">Your signal is DOWN</div>
    </div>

    <!-- Signal Metrics -->
    <div class="details-list">
        <div class="detail-item">
            <span class="detail-label">📊 Pair</span>
            <span class="detail-value" id="pairVal">CAD/CHF (OTC)</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">📈 Trend</span>
            <span class="detail-value" id="trendVal">Breakdown</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">🔷 Pattern</span>
            <span class="detail-value" id="patternVal">Shooting Star</span>
        </div>
        <div class="detail-item">
            <span class="detail-label">⏱️ Expiry</span>
            <span class="detail-value" id="expiryVal">5s / 1m</span>
        </div>
        <div class="detail-item confidence-wrapper">
            <div style="display:flex; justify-content:space-between; width:100%;">
                <span class="detail-label">🎯 Confidence</span>
                <span class="detail-value" id="confidenceVal">88%</span>
            </div>
            <div class="confidence-bar-bg" style="width:100%;">
                <div class="confidence-fill" id="confidenceFill" style="width: 88%;"></div>
            </div>
        </div>
    </div>

    <!-- AI Reason Analysis -->
    <div class="reason-box">
        <div class="reason-title">💬 Reason</div>
        <div id="reasonText">Bearish RSI divergence - price up, RSI down</div>
    </div>

    <!-- Control Inputs -->
    <div class="controls">
        <select id="assetSelect">
            <option value="CAD/CHF (OTC)">CAD/CHF (OTC)</option>
            <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
            <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
            <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
            <option value="BTC/USD (Crypto)">BTC/USD (Crypto)</option>
        </select>

        <select id="manualTrendSelect">
            <option value="AUTO">Auto Detect Market</option>
            <option value="DOWN">🔴 Downtrend (Force DOWN Signals)</option>
            <option value="UP">🟢 Uptrend (Force UP Signals)</option>
        </select>

        <button class="scan-btn" id="scanBtn" onclick="generateNeuroSignal()">ANALYZE MARKET</button>
    </div>

    <!-- Terminal Nav Bar -->
    <div class="footer-nav">
        <div class="nav-item active">📊 Signals</div>
        <div class="nav-item">🎓 Education</div>
        <div class="nav-item">🏆 Leaders</div>
        <div class="nav-item">⭐ Reviews</div>
        <div class="nav-item">❓ FAQ</div>
    </div>
</div>

<script>
    const patternsUp = ["Morning Star", "Bullish Engulfing", "Hammer Reversal", "Volume Spike Green"];
    const patternsDown = ["Shooting Star", "Bearish Engulfing", "Hanging Man", "Volume Spike Red"];

    const reasonsUp = [
        "Bullish RSI divergence — price down, RSI up",
        "Breakout above Key Resistance Level",
        "Volume spike on green candle",
        "EMA 20 Golden Crossover"
    ];

    const reasonsDown = [
        "Bearish RSI divergence — price up, RSI down",
        "Breakdown below Support Level",
        "Strong selling pressure at rejection zone",
        "EMA 20 Death Cross Alignment"
    ];

    function generateNeuroSignal() {
        const btn = document.getElementById("scanBtn");
        btn.disabled = true;
        btn.innerText = "ANALYZING NEURAL DATA...";

        setTimeout(() => {
            const asset = document.getElementById("assetSelect").value;
            const manualTrend = document.getElementById("manualTrendSelect").value;
            
            let isUp = false;
            if (manualTrend === "UP") {
                isUp = true;
            } else if (manualTrend === "DOWN") {
                isUp = false;
            } else {
                isUp = Math.random() > 0.5;
            }

            const signalBox = document.getElementById("signalBox");
            const signalIcon = document.getElementById("signalIcon");
            const signalTitle = document.getElementById("signalTitle");
            
            document.getElementById("pairDisplay").innerText = asset + " • 5s/1m";
            document.getElementById("pairVal").innerText = asset;

            const confidence = Math.floor(Math.random() * (98 - 82 + 1)) + 82;
            document.getElementById("confidenceVal").innerText = confidence + "%";
            document.getElementById("confidenceFill").style.width = confidence + "%";

            if (isUp) {
                signalBox.className = "signal-box up";
                signalIcon.innerText = "↑";
                signalTitle.innerText = "Your signal is UP";
                document.getElementById("trendVal").innerText = "Uptrend Continuation";
                document.getElementById("patternVal").innerText = patternsUp[Math.floor(Math.random() * patternsUp.length)];
                document.getElementById("reasonText").innerText = reasonsUp[Math.floor(Math.random() * reasonsUp.length)];
            } else {
                signalBox.className = "signal-box down";
                signalIcon.innerText = "↓";
                signalTitle.innerText = "Your signal is DOWN";
                document.getElementById("trendVal").innerText = "Breakdown";
                document.getElementById("patternVal").innerText = patternsDown[Math.floor(Math.random() * patternsDown.length)];
                document.getElementById("reasonText").innerText = reasonsDown[Math.floor(Math.random() * reasonsDown.length)];
            }

            btn.disabled = false;
            btn.innerText = "ANALYZE MARKET";
        }, 1200);
    }
</script>

</body>
</html>
