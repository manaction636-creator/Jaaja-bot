<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Macalin Trading Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .control-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .control-label {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      background-color: #1a2332;
      color: #00e5ff;
      border: 1px solid #2a384c;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    .timeframe-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tf-btn {
      flex: 1;
      background-color: #1a2332;
      border: 1px solid #2a384c;
      color: #8b949e;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tf-btn.active {
      background-color: #0052cc;
      color: #ffffff;
      border-color: #0066ff;
    }

    .signal-box {
      background-color: #1a2332;
      border: 1.5px solid #2a384c;
      border-radius: 12px;
      padding: 20px 10px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .signal-box.call {
      background-color: rgba(0, 200, 83, 0.1);
      border-color: #00c853;
    }

    .signal-box.put {
      background-color: rgba(255, 42, 75, 0.1);
      border-color: #ff2a4b;
    }

    .signal-title {
      color: #8b949e;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .signal-box.call .signal-title {
      color: #00c853;
    }

    .signal-box.put .signal-title {
      color: #ff2a4b;
    }

    .timer-text {
      font-size: 14px;
      color: #c9d1d9;
    }

    .scan-btn {
      width: 100%;
      background-color: #1e7e34;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .scan-btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="control-group">
    <label class="control-label">Dooro Lamaanaha Lacagta</label>
    <select id="assetSelect">
      <option value="AUD/USD OTC">AUD/USD OTC</option>
      <option value="EUR/USD OTC">EUR/USD OTC</option>
      <option value="GBP/USD OTC">GBP/USD OTC</option>
      <option value="USD/JPY OTC">USD/JPY OTC</option>
      <option value="EUR/GBP OTC">EUR/GBP OTC</option>
    </select>
  </div>

  <div class="control-group">
    <label class="control-label">Timeframe (Waqtiga Shambada)</label>
    <div class="timeframe-container">
      <button class="tf-btn" onclick="setTimeframe(30, this)">30s</button>
      <button class="tf-btn active" onclick="setTimeframe(60, this)">1m</button>
      <button class="tf-btn" onclick="setTimeframe(300, this)">5m</button>
    </div>
  </div>

  <div class="signal-box" id="signalCard">
    <div class="signal-title" id="actionText">READY TO SCAN</div>
    <div class="timer-text" id="timerText">Next Candle: --s</div>
  </div>

  <button class="scan-btn" onclick="forceScan()">Force Scan Now</button>
</div>

<script>
  let selectedTimeframe = 60; // 60s = 1m
  let timerInterval = null;

  const timerText = document.getElementById('timerText');
  const actionText = document.getElementById('actionText');
  const signalCard = document.getElementById('signalCard');

  // Saacaddu waxay kaliya tusaysaa wakhtiga shamcadda (Countdown) ee socda iyadoon signal beddelayn
  function startSyncedTimer() {
    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      const now = new Date();
      const totalSeconds = now.getMinutes() * 60 + now.getSeconds();
      
      let timeLeft = selectedTimeframe - (totalSeconds % selectedTimeframe);
      timerText.innerText = `Next Candle: ${timeLeft}s`;
    }, 500);
  }

  function setTimeframe(seconds, btnElement) {
    document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    selectedTimeframe = seconds;
    
    // Marka timeframe-ka la beddelo, dib ugu celi xaaladda sugitaanka
    actionText.innerText = "READY TO SCAN";
    signalCard.className = "signal-box";
  }

  // Halkan waxaa kaliya oo signal lagu soo saarayaa marka aad adigu gujiso badhanka
  function forceScan() {
    actionText.innerText = "SCANNING...";
    signalCard.className = "signal-box";
    
    setTimeout(() => {
      const isCall = Math.random() > 0.5;
      
      if (isCall) {
        actionText.innerText = "CALL (BUY 🔺)";
        signalCard.className = "signal-box call";
      } else {
        actionText.innerText = "PUT (SELL 🔻)";
        signalCard.className = "signal-box put";
      }
    }, 600);
  }

  // Bilow timer-ka tusaya wakhtiga oo keliya
  startSyncedTimer();
</script>

</body>
</html>
