<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIDelayX - Session Live Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    /* Session Header Box */
    .session-box {
      background-color: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 16px;
    }

    .session-title-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #00ffcc;
      margin-bottom: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ffcc;
    }

    .session-stats {
      font-size: 13px;
      color: #8b949e;
    }

    .session-stats span {
      color: #ffffff;
      font-weight: bold;
    }

    .profit-text {
      color: #00c853 !important;
    }

    /* Controls */
    .control-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .control-label {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      background-color: #1a2332;
      color: #00ffcc;
      border: 1px solid #2a384c;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* Interactive Blue Button */
    .scan-btn {
      width: 100%;
      background: #00d8ff;
      color: #0b0f19;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 16px;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .scan-btn:active {
      transform: scale(0.98);
      background: #00b0ff;
    }

    /* Active Signal Card */
    .signal-card {
      background-color: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .signal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .trade-num {
      color: #8b949e;
    }

    .pair-name {
      font-weight: 800;
      color: #ffffff;
    }

    .trade-details-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .amount-tag {
      color: #c9d1d9;
    }

    .action-badge {
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
    }

    .action-badge.call {
      background-color: rgba(0, 200, 83, 0.2);
      color: #00c853;
      border: 1px solid #00c853;
    }

    .action-badge.put {
      background-color: rgba(255, 42, 75, 0.2);
      color: #ff2a4b;
      border: 1px solid #ff2a4b;
    }

    .timer-badge {
      font-size: 12px;
      color: #8b949e;
      margin-top: 8px;
      text-align: right;
    }

    .waiting-text {
      text-align: center;
      color: #8b949e;
      font-size: 13px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Session Status Header -->
  <div class="session-box">
    <div class="session-title-row">
      <div class="live-dot"></div>
      Session · live
    </div>
    <div class="session-stats" id="sessionStats">
      <span>27</span> trades · <span>22</span> wins · <span class="profit-text">+$10000.21</span>
    </div>
  </div>

  <!-- Currency Pair Selector -->
  <div class="control-group">
    <label class="control-label">Dooro Lamaanaha Lacagta</label>
    <select id="assetSelect">
      <option value="USD/CHF OTC">USD/CHF OTC</option>
      <option value="EUR/USD OTC">EUR/USD OTC</option>
      <option value="GBP/USD OTC">GBP/USD OTC</option>
      <option value="AUD/USD OTC">AUD/USD OTC</option>
      <option value="USD/JPY OTC">USD/JPY OTC</option>
    </select>
  </div>

  <!-- Scan / Generate Signal Button -->
  <button class="scan-btn" id="generateBtn">GENERATE LIVE SIGNAL</button>

  <!-- Signal Display Card -->
  <div class="signal-card" id="signalCard">
    <div class="waiting-text" id="waitingText">Waiting for a signal...</div>
  </div>
</div>

<script>
  let totalTrades = 27;
  let totalWins = 22;
  let totalProfit = 10000.21;
  let timerInterval = null;

  const generateBtn = document.getElementById('generateBtn');

  function generateLiveSignal() {
    const asset = document.getElementById('assetSelect').value;
    const signalCard = document.getElementById('signalCard');
    
    // Nadiifi timer-ka hore ee socday
    if (timerInterval) clearInterval(timerInterval);

    totalTrades++;
    const isWin = Math.random() > 0.2;
    if (isWin) {
      totalWins++;
      totalProfit += 45.50;
    }

    document.getElementById('sessionStats').innerHTML = `<span>${totalTrades}</span> trades · <span>${totalWins}</span> wins · <span class="profit-text">+$${totalProfit.toFixed(2)}</span>`;

    const isCall = Math.random() > 0.5;
    const actionClass = isCall ? "call" : "put";
    const actionText = isCall ? "BUY 🔺" : "PUT 🔻";

    signalCard.innerHTML = `
      <div class="signal-header-row">
        <span class="trade-num">#${totalTrades}</span>
        <span class="pair-name">${asset}</span>
      </div>
      <div class="trade-details-row">
        <span class="amount-tag">$50.00</span>
        <span class="action-badge ${actionClass}">${actionText}</span>
      </div>
      <div class="timer-badge" id="countdownTimer">30.0s</div>
    `;

    let timeLeft = 30;
    timerInterval = setInterval(() => {
      timeLeft -= 0.5;
      const timerElem = document.getElementById('countdownTimer');
      if (timerElem) {
        if (timeLeft > 0) {
          timerElem.innerText = `${timeLeft.toFixed(1)}s`;
        } else {
          clearInterval(timerInterval);
          timerElem.innerText = "EXPIRED";
        }
      } else {
        clearInterval(timerInterval);
      }
    }, 500);
  }

  // Event Listeners to guarantees button response on touch and click
  generateBtn.addEventListener('click', generateLiveSignal);
  generateBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    generateLiveSignal();
  }, { passive: false });
</script>

</body>
</html>
