<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAAJA-BOT PRO</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #151d28;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #00e676;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #8a99ad;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #8a99ad;
            display: block;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .signal-box {
            border: 2px solid #00e676;
            color: #00e676;
            padding: 15px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            background: rgba(0, 230, 118, 0.05);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .btn {
            background-color: #00e676;
            color: #0b0e14;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #00c853;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>JAAJA-BOT PRO</h2>
    <p class="subtitle">Market Signal Analysis</p>

    <!-- Qaybta Doorashada Lacagta -->
    <div class="form-group">
        <label for="asset">Select Currency Pair (Dooro Lacagta):</label>
        <select id="asset">
            <option value="EUR/USD">EUR/USD (OTC)</option>
            <option value="GBP/USD">GBP/USD (OTC)</option>
            <option value="USD/JPY">USD/JPY (OTC)</option>
            <option value="AUD/USD">AUD/USD (OTC)</option>
            <option value="USD/CAD">USD/CAD (OTC)</option>
            <option value="EUR/GBP">EUR/GBP (OTC)</option>
            <option value="BTC/USD">Crypto - BTC/USD</option>
        </select>
    </div>

    <!-- Qaybta Doorashada Waqtiga -->
    <div class="form-group">
        <label for="timeframe">Select Timeframe (Waqtiga):</label>
        <select id="timeframe">
            <option value="1M">1 Minute</option>
            <option value="2M">2 Minutes</option>
            <option value="5M">5 Minutes</option>
        </select>
    </div>

    <div class="signal-box" id="signalDisplay">CALL ↑</div>

    <div class="info-row">
        <span>Confidence:</span>
        <strong id="confidenceDisplay">85%</strong>
    </div>
    <div class="info-row">
        <span>Indicators:</span>
        <strong>RSI, MACD, EMA</strong>
    </div>

    <button class="btn" onclick="generateSignal()">GET NEXT SIGNAL</button>
</div>

<script>
    function generateSignal() {
        const signals = ["CALL ↑", "PUT ↓"];
        const randomSignal = signals[Math.floor(Math.random() * signals.length)];
        const randomConfidence = Math.floor(Math.random() * (95 - 75 + 1)) + 75;

        const display = document.getElementById("signalDisplay");
        display.innerText = randomSignal;
        
        if (randomSignal === "CALL ↑") {
            display.style.borderColor = "#00e676";
            display.style.color = "#00e676";
            display.style.background = "rgba(0, 230, 118, 0.05)";
        } else {
            display.style.borderColor = "#ff5252";
            display.style.color = "#ff5252";
            display.style.background = "rgba(255, 82, 82, 0.05)";
        }

        document.getElementById("confidenceDisplay").innerText = randomConfidence + "%";
    }
</script>

</body>
</html>
