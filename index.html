<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Claude V2 - AI Trading Signals</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #07090e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Lock Screen Modal */
    .lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121824;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
      text-align: center;
    }

    .bot-logo {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #00ffcc 0%, #008855 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }

    .lock-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .lock-subtitle {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 16px;
    }

    .password-input {
      width: 100%;
      background: #1a2332;
      border: 1px solid #2a384c;
      color: #00ffcc;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      letter-spacing: 4px;
      margin-bottom: 12px;
      outline: none;
    }

    .unlock-btn {
      width: 100%;
      background: #00ffcc;
      color: #07090e;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .contact-hint {
      font-size: 10px;
      color: #8b949e;
    }

    /* Main App Header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 8px;
    }

    .bot-title {
      font-size: 13px;
      font-weight: 800;
      color: #00ffcc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge {
      background: rgba(0, 200, 83, 0.2);
      color: #00c853;
      border: 1px solid #00c853;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
    }

    .engine-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 10px;
      background: #161e2c;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .engine-row span {
      color: #ffffff;
      font-weight: bold;
    }

    /* Signal Display Box */
    .signal-box {
      background: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }

    .signal-label {
      font-size: 10px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .signal-main {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .signal-main.sell { color: #ff2a4b; }
    .signal-main.buy { color: #00c853; }

    .signal-score {
      font-size: 11px;
      color: #ffb703;
      font-weight: bold;
    }

    /* Timeframe Selector */
    .timeframes {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .tf-btn {
      flex: 1;
      background: #1a2332;
      border: 1px solid #2a384c;
      color: #8b949e;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .tf-btn.active {
      background: #00ffcc22;
      border-color: #00ffcc;
      color: #00ffcc;
    }

    /* Indicators Grid */
    .ind-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .ind-card {
      background: #1a2332;
      border: 1px solid #2a384c;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }

    .ind-name {
      font-size: 9px;
      color: #8b949e;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .ind-val {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Detailed Analysis Notes */
    .notes-box {
      background: #161e2c;
      border: 1px solid #2a384c;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 10px;
      color: #8b949e;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .notes-box div {
      margin-bottom: 2px;
    }

    /* Action Buttons */
    .action-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-scan { background: #00ffcc; color: #07090e; }
    .btn-reset { background: #2a384c; color: #ffffff; }
    .btn-buy-action { background: #00c853; color: #ffffff; }
    .btn-sell-action { background: #ff2a4b; color: #ffffff; }

    /* Auto Trade Toggle */
    .auto-trade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a2332;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #8b949e;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2a384c;
      transition: .3s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
