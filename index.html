<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOT GAINER - Trade Smarter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #0f172a;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header Section */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-box {
      width: 34px;
      height: 34px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-weight: bold;
    }

    .brand-title h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-title p {
      font-size: 9px;
      color: #64748b;
      letter-spacing: 1px;
    }

    .online-badge {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #10b981;
      border-radius: 50%;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #cbd5e1;
    }

    /* Selectors Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .control-card {
      background-color: #162032;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
    }

    .market-toggle {
      display: flex;
      background: #0f172a;
      border-radius: 6px;
      padding: 2px;
    }

    .market-btn {
      font-size: 9px;
      padding: 3px 6px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      font-weight: 600;
    }

    .market-btn.active {
      background: #3b82f6;
      color: #ffffff;
    }

    select {
      width: 100%;
      background-color: #0f172a;
      color: #ffffff;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }

    /* Main Signal Card */
    .main-card {
      background: linear-gradient(180deg, #162032 0%, #111827 100%);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .main-card h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .main-card p {
      font-size: 12px;
      color: #94a3b8;
      max-width: 240px;
      line-height: 1.4;
    }

    .get-signal-btn {
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: transform 0.1s ease;
    }

    .get-signal-btn:active {
      transform: scale(0.98);
    }

    .get-signal-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Signal Result Output */
    .signal-output {
      display: none;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      margin-top: 8px;
    }

    .signal-direction {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .call { color: #10b981; }
    .put { color: #ef4444; }

    .signal-meta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Stats Row */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      background-color: #162032;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-icon {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .stat-title {
      font-size: 11px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .stat-sub {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }
